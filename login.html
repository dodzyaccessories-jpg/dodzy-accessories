<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | DODZY ACCESSORIES</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#f7f0e6;--brown:#513a2c;--gold:#b99562;--paper:#fffdf9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f7f0e6,#ead9c4);font-family:Cairo,Arial,sans-serif;color:var(--brown)}.box{width:min(100%,430px);background:var(--paper);border:1px solid #e7d8c4;border-radius:24px;padding:32px;box-shadow:0 20px 70px #513a2c18;text-align:center}.logo{width:110px;height:110px;object-fit:contain;margin-bottom:10px}.eyebrow{letter-spacing:2px;color:var(--gold);font-size:12px;font-weight:800}.box h1{font-size:25px;margin:6px 0}.box p{line-height:1.8;color:#796758}.field{text-align:right;margin:20px 0 12px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #dfd2c0;border-radius:12px;font:inherit;background:#fff}button,.back{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--brown);color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin-top:12px}.back{background:#eee3d4;color:var(--brown)}.error{color:#a32929!important;font-weight:700;min-height:25px;font-size:14px}.notice{font-size:12px;background:#fff4d8;border-radius:10px;padding:10px;margin-top:18px}</style></head><body><main class="box"><img class="logo" src="assets/logo.svg" alt="Dodzy Accessories"><div class="eyebrow">DODZY ACCESSORIES</div><h1>تسجيل دخول الإدارة</h1><p>أدخلي كلمة المرور لفتح لوحة إدارة المتجر.</p><form id="loginForm"><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" placeholder="اكتبي كلمة المرور"></div><div id="error" class="error" role="alert"></div><button type="submit">تسجيل الدخول</button></form><a class="back" href="index.html">العودة إلى المتجر</a><div class="notice">تنبيه: هذه بوابة تجريبية فقط لموقع ثابت؛ كلمة المرور داخل الصفحة ليست حماية آمنة ولا تحمي بيانات الإدارة فعليًا. لا تستخدميها لتخزين بيانات حساسة.</div></main><script>/* Demo-only password gate. Change this value before use; not secure for a public store. */const DEMO_PASSWORD='Dodzy2026!';document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('password').value===DEMO_PASSWORD){sessionStorage.setItem('dodzyAdminDemoLogin','yes');location.href='admin.html'}else{document.getElementById('error').textContent='كلمة المرور غير صحيحة.'}});</script></body></html>
